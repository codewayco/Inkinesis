name: ci
on: [push, pull_request]
jobs:
  portable-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tools/generate/test -p test_prepare_character.py
      - run: npx playwright install --with-deps chromium
      - name: Local UI, uploads, and explicit Save (no model APIs)
        env:
          BROWSER: none
        run: |
          npm run dev -- --host 127.0.0.1 --port 5200 --strictPort > /tmp/inkinesis-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5200/ > /dev/null && break
            sleep 1
          done
          npm run verify:example-download
          npm run verify:ui
          node --import tsx tools/verify/uiSaveSmoke.ts
