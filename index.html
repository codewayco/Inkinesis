<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkinesis</title>
<style>
  :root {
    color-scheme: dark;
    --background: #171717;
    --panel: #1d1d1d;
    --surface: #242424;
    --surface-hover: #2e2e2e;
    --canvas: #202020;
    --stage-background: #000000;
    --border: #393939;
    --border-hover: #57534d;
    --text: #ede9e3;
    --text-secondary: #cbc5bc;
    --text-muted: #a9a39a;
    --accent: #e8e2d6;
    --accent-hover: #f5f0e8;
    --on-accent: #24211c;
  }
  [hidden] { display: none !important; }
  /* One screen, split: controls on the left, the character on the right.
     Nothing on this page scrolls the document -- the left column takes its own
     scrollbar if a short viewport needs one, so the character never leaves. */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--background); color: var(--text);
    font: 13px/1.35 system-ui, sans-serif;
    display: grid; grid-template-columns: 380px 1fr;
  }
  @media (max-width: 900px) { body { grid-template-columns: 300px 1fr; } }

  /* ---- left: the controls ------------------------------------------------ */
  #panel {
    height: 100vh; overflow-y: auto; padding: 14px 16px 16px;
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px;
  }
  #panel > * { flex-shrink: 0; }
  #movementDetails { width: min(560px, calc(100vw - 32px)); max-height: 80vh; overflow-y: auto; border: 1px solid var(--border-hover); border-radius: 10px; padding: 20px; background: var(--surface); color: var(--text); line-height: 1.5; }
  #movementDetails::backdrop { background: rgb(0 0 0 / 55%); }
  #movementDetails h2 { margin: 0 0 12px; font-size: 18px; }
  #movementDetails > button { margin-top: 14px; }
  h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }

  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  fieldset[disabled] { opacity: 0.4; }
  legend {
    padding: 0; margin-bottom: 4px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--text-muted);
  }

  button, select, input[type=text], textarea {
    font: inherit; color: inherit;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 9px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { background: var(--surface-hover); border-color: var(--border-hover); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { color: var(--on-accent); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:focus-visible, select:focus-visible, textarea:focus-visible,
  input:focus-visible, summary:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 3px;
  }
  input[type=checkbox], progress { accent-color: var(--accent); }
  input[type=range]:disabled { accent-color: var(--border-hover); }
  a { color: var(--text-secondary); }
  a:hover { color: var(--accent); }
  textarea { width: 100%; resize: vertical; font-size: 13px; }
  select { width: 100%; }

  .row { display: flex; gap: 5px; flex-wrap: wrap; }
  .row > button { flex: 1 1 auto; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; }

  .avatar-card { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .avatar-card img { width: 100%; height: 120px; object-fit: contain; background: var(--canvas); border-radius: 4px; }
  .avatar-card small { color: var(--text-muted); font-size: 10px; }
  .avatar-card[aria-pressed="true"], #motionDemo[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .avatar-install { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; }
  .avatar-install progress { width: 100%; }

  /* A slider row: name, track, value. Two of them fit side by side. */
  .slider { display: grid; grid-template-columns: 46px 1fr 26px; align-items: center; gap: 6px; }
  .slider > span { font-size: 11px; color: var(--text-muted); }
  .slider > output { font-size: 11px; color: var(--text-secondary); text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; min-width: 0; margin: 0; accent-color: var(--accent); }

  label.check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  input[type=file] { font-size: 11px; max-width: 100%; }
  input[type=file]::file-selector-button {
    font: inherit; color: inherit; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px;
    margin-right: 8px;
  }
  .hint { font-size: 11px; color: var(--text-muted); min-height: 14px; }

  /* ---- right: the character ---------------------------------------------- */
  #stage {
    height: 100vh; min-width: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--stage-background);
  }
  canvas { width: 100%; height: 100%; display: block; }
  #status {
    position: fixed; left: 398px; bottom: 14px;
    font-size: 11px; color: var(--text-muted); max-width: calc(100% - 420px);
  }
  @media (max-width: 900px) { #status { left: 318px; max-width: calc(100% - 340px); } }
  [hidden] { display: none !important; }

  /* The panel carries a fixed set of controls, so on a shorter screen it gets
     tighter rather than longer: the requirement is that the character and the
     controls share ONE screen, at any laptop height, with nothing to scroll. */
  @media (max-height: 880px) {
    #panel { gap: 7px; padding: 11px 14px 12px; }
    #panel > * { flex-shrink: 0; }
  #movementDetails { width: min(560px, calc(100vw - 32px)); max-height: 80vh; overflow-y: auto; border: 1px solid var(--border-hover); border-radius: 10px; padding: 20px; background: var(--surface); color: var(--text); line-height: 1.5; }
  #movementDetails::backdrop { background: rgb(0 0 0 / 55%); }
  #movementDetails h2 { margin: 0 0 12px; font-size: 18px; }
  #movementDetails > button { margin-top: 14px; }
  h1 { font-size: 15px; }
    .hint { min-height: 0; }
    #generatePrompt { height: 50px; }
    #speech { height: 36px; }
  }
  @media (max-height: 780px) {
    #panel { gap: 5px; }
    legend { margin-bottom: 2px; }
    button, select, textarea { padding: 4px 8px; }
    #generatePrompt { height: 42px; }
    .slider { grid-template-columns: 42px 1fr 24px; gap: 4px; }
  }
</style>

<div id="panel">
  <h1>Inkinesis</h1>

  <fieldset>
    <legend>Describe a character</legend>
    <textarea id="generatePrompt" rows="3"
      placeholder="an adult adventurer, expressive amber eyes, short teal hair, a fitted jacket and shorts">an adult adventurer, expressive amber eyes, short teal hair, a fitted jacket and shorts</textarea>
    <div class="row" style="margin-top:5px">
      <button id="generate" class="primary">Generate</button>
      <button id="loadGenerated">Load last saved</button>
    </div>
    <div class="row" id="generatedActions" hidden>
      <select id="recentGenerations" aria-label="Recent generations"><option value="">Session previews</option></select>
      <button id="saveGenerated" disabled>Save</button>
    </div>
    <div class="hint" id="saveState" role="status"></div>
    <div class="hint" id="generateState" aria-live="polite">checking…</div><details id="generationSetup" class="hint" hidden><summary>Generation setup details</summary><ul id="generationMissing" style="max-height:160px;overflow:auto;overflow-wrap:anywhere;padding-left:18px"></ul></details><div class="row" id="downloads"></div>
  </fieldset>

  <fieldset>
    <button id="pickAvatar" type="button" aria-expanded="false" aria-controls="avatarSamples">Pick an Avatar</button>
    <div class="grid" id="avatarSamples" hidden style="margin-top:6px">
    </div>
    <div style="margin-top:6px"><input id="source" type="file" accept="image/png,image/jpeg,image/webp,.inp"></div>
  </fieldset>

  <fieldset id="head" disabled>
    <legend>Head<span id="headState"></span></legend>
    <div class="grid">
      <label class="slider"><span>Yaw</span>
        <input id="yaw" type="range" min="-30" max="30" step="1" value="0"><output id="yawOut">0</output></label>
      <label class="slider"><span>Pitch</span>
        <input id="pitch" type="range" min="-30" max="30" step="1" value="0"><output id="pitchOut">0</output></label>
      <label class="slider"><span>Roll</span>
        <input id="roll" type="range" min="-30" max="30" step="1" value="0"><output id="rollOut">0</output></label>
      <label class="slider"><span>Jaw</span>
        <input id="jaw" type="range" min="0" max="100" step="1" value="0"><output id="jawOut">0.00</output></label>
    </div>
    <div class="row" style="margin-top:5px"><button id="headReset">Neutral</button></div>
  </fieldset>

  <fieldset id="body" disabled>
    <legend>Body<span id="bodyState"></span></legend>
    <div class="grid">
      <label class="slider"><span>Sh. L</span>
        <input id="body_shoulderL" type="range" min="-90" max="90" step="1" value="0"><output id="body_shoulderLOut">0</output></label>
      <label class="slider"><span>Sh. R</span>
        <input id="body_shoulderR" type="range" min="-90" max="90" step="1" value="0"><output id="body_shoulderROut">0</output></label>
      <label class="slider"><span>Elb. L</span>
        <input id="body_elbowL" type="range" min="-90" max="90" step="1" value="0"><output id="body_elbowLOut">0</output></label>
      <label class="slider"><span>Elb. R</span>
        <input id="body_elbowR" type="range" min="-90" max="90" step="1" value="0"><output id="body_elbowROut">0</output></label>
      <label class="slider"><span>Hip L</span>
        <input id="body_hipL" type="range" min="-90" max="90" step="1" value="0"><output id="body_hipLOut">0</output></label>
      <label class="slider"><span>Hip R</span>
        <input id="body_hipR" type="range" min="-90" max="90" step="1" value="0"><output id="body_hipROut">0</output></label>
      <label class="slider"><span>Knee L</span>
        <input id="body_kneeL" type="range" min="-90" max="90" step="1" value="0"><output id="body_kneeLOut">0</output></label>
      <label class="slider"><span>Knee R</span>
        <input id="body_kneeR" type="range" min="-90" max="90" step="1" value="0"><output id="body_kneeROut">0</output></label>
    </div>
    <div class="row" style="margin-top:5px"><button id="bodyRest">Rest</button></div>
    <div class="row" style="margin-top:5px"><button id="motionDemo" type="button" aria-pressed="false">Motion Demo</button></div>
    <div class="hint" id="bodyNote"></div>
  </fieldset>

  <fieldset id="speak" disabled>
    <legend>Speak<span id="speakState"></span></legend>
    <textarea id="speech" rows="2" placeholder="Say this…"></textarea>
    <div class="row" style="margin-top:5px">
      <button id="say" class="primary">Speak</button>
      <button id="stopSpeaking">Stop</button>
    </div>
    <div class="row" id="expressions" style="margin-top:5px"></div>
    <div class="hint" id="speechStatus" role="status" hidden></div>
  </fieldset>

  <label class="check"><input id="idle" type="checkbox" checked> Idle and blink</label>

  <fieldset>
    <legend>Record</legend>
    <div class="row"><button id="record">Record a clip</button></div>
    <div class="hint" id="recordState"></div>
  </fieldset>

  <!-- The preview script drives itself from these: the renderer and render
       scale it composes at, and the synthetic example's own transport. They are
       engine settings rather than anything a viewer chooses, so they are kept
       at their defaults and out of the way. -->
  <div hidden>
    <select id="mode"><option value="cpu" selected>CPU</option><option value="gpu">WebGL</option></select>
    <select id="scale"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select>
    <input id="time" type="range" min="0" max="128" value="0">
    <button id="play">Play</button>
    <button id="reset">Reset</button>
    <button id="example">Synthetic example</button>
    <!-- The engine's own test fixtures: a head with no body, and an untextured
         mannequin. They are how the repository checks itself, not avatars. -->
    <button id="visemeCharacter">Viseme fixture</button>
    <button id="bodyCharacter">Body fixture</button>
    <input id="confirmation" type="file" accept=".json" multiple>
    <button id="clearConfirmation">Clear</button>
  </div>
</div>

<div id="stage">
  <canvas id="frame" width="768" height="1024" aria-label="The avatar"></canvas>
</div>
<output id="status" aria-live="polite"></output>

<script type="module" src="/player/src/combinedPreview.ts"></script>
</html>
