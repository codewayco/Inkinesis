// Compiles the isolated GPL adapter without changing the external engine build.
allprojects { project ->
    afterEvaluate {
        if (!project.pluginManager.hasPlugin('org.jetbrains.kotlin.jvm')) return
        project.extensions.getByName('kotlin').sourceSets.getByName('main').kotlin.srcDir(project.property('combinedAdapterDir').toString())
        project.tasks.register('exportCombinedLive2D', JavaExec) {
            dependsOn project.tasks.named('classes')
            classpath = project.sourceSets.main.output + project.configurations.compileClasspath
            mainClass = 'io.github.psd2live.combinedexport.CombinedExportKt'
            def exportHeap = System.getenv('INKINESIS_LIVE2D_JAVA_HEAP') ?: '16g'
            if (!(exportHeap ==~ /[1-9][0-9]*[mg]/)) throw new GradleException('Invalid INKINESIS_LIVE2D_JAVA_HEAP')
            jvmArgs "-Xmx${exportHeap}", '-Dfile.encoding=UTF-8', '-Djava.awt.headless=true'
            args project.property('combinedInput').toString(), project.property('combinedOutput').toString()
        }
    }
}
